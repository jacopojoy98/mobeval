# OmniTraj next to the other models on ONE CITY of the vehicle panel.
#
# OmniTraj is a city-scale model: its 16 x 16 region grid and its coordinate normalisation assume one
# urban area (the paper: Chengdu and Xi'an, ~9 km across), and its road vocabulary is every segment
# of that city. So this config keeps only the trips lying entirely inside a city's bounding box
# (the paper also "filtered out trajectories recorded outside urban areas" and trips under 20
# points), and every model is evaluated on that same subset.
#
# 1. Road network and map matching (CPU job, once per city; BBOX = prepare.bbox below):
#      qsub -v BBOX="44.80 45.90 8.50 9.80",CITY=milan jobs/mapmatch.pbs
# 2. Train and evaluate:
#      qsub -v CONFIG=$PWD/examples/configs/omnitraj_city.yaml,RESULTS_DIR=$HOME/results_milan jobs/all_in_one.pbs
title: OmniTraj and the other models on one city (Milan)
output_dir: /home/jcolombini/results_milan                 # its own folder: the models here are trained on one city,
progress_dir: /home/jcolombini/results_milan/progress      # so their checkpoints must not mix with the full panel's
persist_dir: /home/jcolombini/results_milan

dataset:
  loader: csv
  train_path: /home/$USER/data/data_by_fua_final/train.csv
  test_path: /home/$USER/data/data_by_fua_final/test_FVF.csv
  time_col: datetime
  user_id: uid
  traj_id: trip_id
  lat: lat
  lon: lng
  query: "QUALITY >= 2"
  clean: {max_speed_mps: 70}
  prepare:
    bbox: [44.80, 45.90, 8.50, 9.80]     # Milan and its surroundings (~122 x 102 km); must equal the
                                          # BBOX given to jobs/mapmatch.pbs
    min_traj_points: 20                   # OmniTraj's filter

eval:
  split_by: predefined
  val_by: time
  val_fraction: 0.1
  staypoint_method: trips
  staypoint_time_s: 1200
  trip_max_stay_s: 259200
  window_length: 64
  max_gap_s: 300
  visit_context: 8
  grid_cell_m: 500
  eval_seeds: [0, 1, 2]
  n_boot: 1000
  max_eval_samples: 5000
  retrieval_db_size: 20000                # the paper retrieves among 20,000 test trips
  retrieval_queries: 1000
  visualize_samples: 6                    # sample maps in <run>/samples, over the map-matching road network
  visualize_roads: /home/jcolombini/data/roads/milan/network.npz

models:
  - name: OmniTraj                        # the released code's training
    type: omnitraj
    recipe: code
    train:
      device: cuda
      options: {roads_file: /home/jcolombini/data/roads/milan/matched.csv.gz}
    adapter: {device: cuda, batch_size: 512}

  - name: OmniTraj-paper                  # the paper's loss (InfoNCE on cosine similarity) and Adam
    type: omnitraj
    recipe: paper
    train:
      device: cuda
      options: {roads_file: /home/jcolombini/data/roads/milan/matched.csv.gz}
    adapter: {device: cuda, batch_size: 512}

  # The other models on the same city subset, for a like-for-like table
  - name: UniTraj-zeroshot
    type: unitraj
    checkpoint: /home/jcolombini/model.pt
    external_pretraining: true
    adapter: {device: cuda, batch_size: 256}
  
  - name: UniTraj-finetuned
    type: unitraj
    train: {init_from: /home/jcolombini/model.pt, epochs: 60, batch_size: 128, lr: 3.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda, batch_size: 256}

  - name: UniTraj-fulltrain
    type: unitraj
    recipe: code 
    train: { epochs: 1000, batch_size: 256, lr: 3.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda, batch_size: 256}

  - name: TrajGPT
    type: trajgpt
    recipe: code
    train: {epochs: 20, batch_size: 64, lr: 1.0e-3, patience: 15, device: cuda}
    adapter: {device: cuda}

  - name: CLIPMobility
    type: clip_mobility
    recipe: code
    train: {epochs: 1000 , batch_size: 64, lr: 1.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda}

  - name: TransferTraj
    type: transfertraj
    arch: {embed_size: 64, d_model: 128, rafee_layer: 2}
    train: {epochs: 1000, batch_size: 64, lr: 1.0e-3, patience: 50,  device: cuda}
    adapter:
        device: cuda
        batch_size: 64
        coord_scale: 1000
        context: {poi_embed: /home/jcolombini/data/Context/poi_embed.npy, poi_latlon: /home/jcolombini/data/Context/poi_latlon.npy, road_embed: /home/jcolombini/data/Context/road_embed.npy, road_latlon: /home/jcolombini/data/Context/road_latlon.npy}

  - name: KinematicRef
    type: kinematic_ref
