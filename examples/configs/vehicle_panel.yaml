# Pre-split vehicle GPS panel data with columns:
#   uid,DAY,HH24,lat,lng,SPEED,HEADING,QUALITY,ID_PANELSESSION,DELTAPOS,datetime,tid,trip_id,trip_id_segment,user
# mobeval info --config examples/configs/vehicle_panel.yaml     (check sizes first)
# mobeval run  --config examples/configs/vehicle_panel.yaml
title: Mobility foundation models on vehicle panel data
output_dir: /home/jcolombini/results
progress_dir: /home/jcolombini/results/progress
persist_dir: /home/jcolombini/results

dataset:
  loader: csv                     # .csv or .parquet
  train_path: /home/jcolombini/data/data_by_fua_final/train.csv
  test_path: /home/jcolombini/data/data_by_fua_final/test_FVF.csv
  time_col: datetime              # naive local time is kept as local clock time
  user_id: uid                    # check: `uid` or `user`, whichever identifies a person/vehicle
  traj_id: trip_id                # one trip = one trajectory (made unique per user automatically)
  lat: lat
  lon: lng
  query: "QUALITY >= 2"           # optional: adjust to the meaning of QUALITY in your data
  clean: {max_speed_mps: 70}      # drop impossible jumps (> 250 km/h), duplicates, 1-point trips

eval:
  split_by: predefined            # use your files; validation is carved from TRAIN only
  val_by: time                    # latest 10% of train trips (or: user)
  val_fraction: 0.1
  staypoint_method: trips         # stays = gaps between consecutive trips (points only recorded while moving)
  staypoint_time_s: 1200          # a stay lasts at least 20 minutes
  trip_max_stay_s: 86400         # gaps longer than 3 days are missing data
  window_length: 64               # points per GPS window; check sampling interval with `mobeval info`
  max_gap_s: 300                  # windows never span a sampling gap longer than this
  visit_stride: 16
  visit_context: 16
  grid_cell_m: 500
  eval_seeds: [0, 1, 2]
  n_boot: 1000
  max_eval_samples: 5000
  train_eval: true                # also score recovery / next location / time on a train sample:
                                  # report section "Fit on the training data", train_vs_test.csv
  travel_time_max_h: 4.0


  # --- protocols -------------------------------------------------------------
  # UniTraj and TransferTraj have no next-location or time head; the linear probe puts them on
  # the same axis using their frozen embeddings. Probe results are reported separately.
  location_protocols:   [native, linear_probe]
  continuous_protocols: [native, linear_probe]
  probe_top_k: 2000               # candidate cells; the log prints what share of targets they cover
  probe_max_train: 100000
  
  generation_max_real_trajectories: 20000   # test trajectories behind the reference stats
  generation_nn_max_train: 3000
  generation_nn_max_query: 2000
  # --- representation-level tasks --------------------------------------------
  # Read user identification against the `mean_location` baseline, not against chance.
  user_id_max_users: 100
  user_id_min_windows: 8
  # teleport is caught by any speed check; detour and loop preserve every step length exactly,
  # so only a model that learned plausible routes can beat the kinematic baseline on them.
  anomaly_kinds: [teleport, detour, loop]
  anomaly_rate: 0.1
  anomaly_protocols: [embedding_knn, reconstruction]

  generation_protocols: [native, rollout]
  rollout_seed_points: 4
  rollout_block: 8

models:
  - name: UniTraj-zeroshot
    type: unitraj
    checkpoint: /home/jcolombini/model.pt
    external_pretraining: true
    adapter: {device: cuda, batch_size: 256}
  - name: UniTraj-finetuned
    type: unitraj
    train: {init_from: /home/jcolombini/model.pt, epochs: 60, batch_size: 128, lr: 3.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda, batch_size: 256}
  - name: UniTraj-fulltrain
    type: unitraj
    train: { epochs: 500, batch_size: 128, lr: 3.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda, batch_size: 256}
  - name: TrajGPT
    type: trajgpt
    train: {epochs: 20, batch_size: 64, lr: 1.0e-3, patience: 15, device: cuda}
    adapter: {device: cuda}
  - name: CLIPMobility
    type: clip_mobility
    train: {epochs: 1000 , batch_size: 64, lr: 1.0e-4, patience: 50, device: cuda}
    adapter: {device: cuda}
  - name: TransferTraj
    type: transfertraj
    arch: {embed_size: 64, d_model: 128, rafee_layer: 2}
    train: {epochs: 1000, batch_size: 64, lr: 1.0e-3, patience: 50,  device: cuda}
    adapter: 
        device: cuda 
        batch_size: 64
        coord_scale: 1000
        context: {poi_embed: /home/jcolombini/data/Context/poi_embed.npy, poi_latlon: /home/jcolombini/data/Context/poi_latlon.npy, road_embed: /home/jcolombini/data/Context/road_embed.npy, road_latlon: /home/jcolombini/data/Context/road_latlon.npy}
