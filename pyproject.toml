[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mobeval"
version = "0.2.0"
description = "Unified evaluation and (re)training of human-mobility foundation models"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "tabulate>=0.9", "pyyaml>=6"]

[project.optional-dependencies]
models = ["torch>=2.1"]
h3 = ["h3>=4"]
test = ["pytest>=7"]

[project.scripts]
mobeval = "mobeval.cli:main"

[tool.setuptools.packages.find]
include = ["mobeval*"]
