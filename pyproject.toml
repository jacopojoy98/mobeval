[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mobeval"
version = "0.2.0"
description = "Unified evaluation and (re)training of human-mobility foundation models"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
models = ["torch>=2.1"]
yaml = ["pyyaml>=6"]          # YAML configs (JSON configs work without it)
reports = ["tabulate>=0.9"]  # prettier markdown tables (a plain fallback is built in)
h3 = ["h3>=4"]
omnitraj = ["timm>=0.9", "einops>=0.6", "transformers>=4.30", "osmium>=3.6", "shapely>=2"]
plots = ["matplotlib>=3.7"]   # plot_results.py and the sample figures (mobeval visualize)
test = ["pytest>=7"]

[project.scripts]
mobeval = "mobeval.cli:main"

[tool.setuptools.packages.find]
include = ["mobeval*"]
